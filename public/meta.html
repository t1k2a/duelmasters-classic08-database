<html lang="ja">

    "@context": "https://schema.org",

    "description": "実データ9,114件から算出したデュエル・マスターズ クラシック08の環境Tier表とデッキレシピ解説。",

<body class="bg-slate-950 min-h-screen flex flex-col items-center">

<!-- ヘッダー -->
<header class="w-full bg-indigo-700 text-white shadow-md sticky top-0 z-20 flex justify-center">
  <div class="w-full max-w-[430px] px-4 py-3 flex items-center gap-3">
  <span class="text-lg font-bold tracking-wide">🃏 メタデッキ紹介</span>
  <a href="regulations.html" class="ml-auto text-indigo-100 hover:text-white text-sm underline underline-offset-2">レギュレーション</a>
  <a href="index.html" class="text-indigo-100 hover:text-white text-sm underline underline-offset-2">カード検索</a>
  </div>
</header>

<!-- LP ラッパー: SP幅を中央に配置 -->
<div class="flex justify-center w-full min-h-[calc(100vh-52px)]">
  <div class="w-full max-w-[430px] bg-gray-50 dark:bg-slate-900 dark:text-slate-100 flex flex-col shadow-2xl md:border-x md:border-slate-800 min-h-[calc(100vh-52px)] transition-colors duration-200">
    <div class="px-4 py-3">
      <p class="text-xs text-gray-500 leading-relaxed">
        クラシック08環境（2008年12月時点）の代表的なメタデッキです。カード名をタップするとカード検索で詳細を確認できます。
      </p>
    </div>
    <div id="deckList" class="px-4 pb-8 space-y-4">
      <div id="loadingMsg" class="py-8 text-center text-gray-400 text-sm">読み込み中...</div>
    </div>
  </div>
</div>

<script>
const CIV_COLORS = {光:'civ-光',水:'civ-水',闇:'civ-闇',火:'civ-火',自然:'civ-自然'};

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

function civBadge(civs) {
  return (civs || []).map(c =>
    `<span class="${CIV_COLORS[c] || ''} border rounded-full px-2 py-0.5 text-xs">${escapeHtml(c)}</span>`
  ).join(' ');
}

function tagBadge(tags) {
  return (tags || []).map(t =>
    `<span class="bg-gray-100 text-gray-600 border border-gray-200 rounded px-2 py-0.5 text-xs">${escapeHtml(t)}</span>`
  ).join(' ');
}

function deckCardLink(card) {
  const href = `index.html?q=${encodeURIComponent(card.name)}`;
  return `
    <a href="${href}" class="flex items-center justify-between gap-2 py-1.5 px-2 rounded hover:bg-indigo-50">
      <span class="text-sm text-gray-800 truncate hover:text-indigo-600">${escapeHtml(card.name)}</span>
      <span class="text-xs text-gray-500 shrink-0">×${card.count | 0}</span>
    </a>`;
}

function deckCardHTML(deck) {
  const total = (deck.cards || []).reduce((s, c) => s + (c.count | 0), 0);
  return `
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
      <div class="px-4 py-3 border-b border-gray-100">
        <div class="flex items-center gap-2 flex-wrap">
          <h2 class="font-bold text-base text-gray-900">${escapeHtml(deck.name)}</h2>
          <span class="ml-auto text-xs text-gray-400 shrink-0">${total}枚掲載</span>
        </div>
        <div class="flex items-center gap-1 flex-wrap mt-2">
          ${civBadge(deck.civilization)}
          ${tagBadge(deck.tags)}
        </div>
        <p class="text-xs text-gray-600 leading-relaxed mt-2">${escapeHtml(deck.description)}</p>
      </div>
      <div class="divide-y divide-gray-50 px-2 py-1">
        ${(deck.cards || []).map(deckCardLink).join('')}
      </div>
    </div>`;
}

fetch('data/meta-decks.json')
  .then(r => r.json())
  .then(decks => {
    document.getElementById('loadingMsg')?.remove();
    if (!Array.isArray(decks) || !decks.length) {
      document.getElementById('deckList').innerHTML =
        `<div class="py-8 text-center text-gray-400 text-sm">メタデッキがまだ登録されていません。</div>`;
      return;
    }
    document.getElementById('deckList').innerHTML = decks.map(deckCardHTML).join('');
  })
  .catch(() => {
    document.getElementById('deckList').innerHTML =
      `<div class="py-8 text-center text-gray-400 text-sm">読み込みに失敗しました。</div>`;
  });
</script>
</body>
</html>

<script>
// ===== テーマ切り替え & スクロールトップ (Phase 3) =====
function initTheme() {
  const saved = localStorage.getItem('dm_theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
  const isDark = saved ? saved === 'dark' : prefersDark.matches;
  applyTheme(isDark);

  // OSテーマの動的変更を監視（ユーザーの手動保存がない場合）
  prefersDark.addEventListener('change', e => {
    if (!localStorage.getItem('dm_theme')) {
      applyTheme(e.matches);
    }
  });
}

function applyTheme(isDark) {
  document.documentElement.classList.toggle('dark', isDark);
  const btn = document.getElementById('themeToggleBtn');
  if (btn) btn.textContent = isDark ? '☀️' : '🌙';
}

function toggleTheme() {
  const isDark = !document.documentElement.classList.contains('dark');
  applyTheme(isDark);
  localStorage.setItem('dm_theme', isDark ? 'dark' : 'light');
}

function scrollToTop() {
  const listEl = document.getElementById('cardList');
  if (listEl) listEl.scrollTo({ top: 0, behavior: 'smooth' });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  const listEl = document.getElementById('cardList');
  const scrollBtn = document.getElementById('scrollTopBtn');
  const checkScroll = (st) => {
    if (!scrollBtn) return;
    if (st > 250) {
      scrollBtn.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-2');
    } else {
      scrollBtn.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
    }
  };

  if (listEl) listEl.addEventListener('scroll', () => checkScroll(listEl.scrollTop));
  window.addEventListener('scroll', () => checkScroll(window.scrollY));

  // 初期スクロール位置を判定してFAB表示を設定
  const initialScroll = Math.max(listEl ? listEl.scrollTop : 0, window.scrollY || 0);
  checkScroll(initialScroll);
});
initTheme();
</script>
