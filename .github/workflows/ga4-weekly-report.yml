name: Weekly GA4 Analytics & Strategy Report

on:
  schedule:
    # 毎週月曜 09:00 JST (月曜 00:00 UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run GA4 Analytics Report
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          GA4_MOCK: ${{ secrets.GA4_PROPERTY_ID == '' && 'true' || 'false' }}
        run: npx tsx scripts/ga4-analytics.ts

      - name: Commit and push report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/marketing/ga4-action-strategy.md
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(marketing): 週次GA4改善施策レポート自動更新 [skip ci]"
          git push origin main || true
