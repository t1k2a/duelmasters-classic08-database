name: X (Twitter) Scheduled Auto-Post

on:
  schedule:
    # 毎日 12:00 JST (03:00 UTC) ＆ 21:00 JST (12:00 UTC) [Xアナリティクス実測ピーク準拠]
    - cron: '0 3 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

concurrency:
  group: x-auto-post-queue
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post-to-x:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run X post queue
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: npx tsx scripts/x-post-queue.ts

      - name: Commit and push updated queue
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/marketing/x-post-queue.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(marketing): X投稿ステータス自動更新 [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
